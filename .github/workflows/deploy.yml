name: Deploy no Raspberry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      APP_DIR: /home/dawid/app/Unilife              
      MANAGE:  /home/dawid/app/Unilife/manage.py   
      VENV:    /home/dawid/app/Unilife/.venv

    steps:
      - name: Atualizar código
        run: |
          set -e
          git -C "$APP_DIR" fetch --all
          git -C "$APP_DIR" reset --hard origin/${GITHUB_REF_NAME}

      - name: Preparar venv, instalar deps, migrar e coletar estáticos
        run: |
          set -e
          # cria venv se não existir
          if [ ! -x "$VENV/bin/python" ]; then
            python3 -m venv "$VENV"
          fi

          # usa SEMPRE o pip/python da venv
          "$VENV/bin/pip" install -U pip wheel
          if [ -f "$APP_DIR/requirements.txt" ]; then
            "$VENV/bin/pip" install -r "$APP_DIR/requirements.txt"
          else
            # fallback mínimo se não houver requirements.txt
            "$VENV/bin/pip" install django
          fi

          # comandos do Django usando o python da venv
          "$VENV/bin/python" "$MANAGE" migrate --noinput
          "$VENV/bin/python" "$MANAGE" collectstatic --noinput || true

      - name: Reiniciar serviço do Django
        run: |
          sudo systemctl restart django-runserver
          sudo systemctl --no-pager status django-runserver