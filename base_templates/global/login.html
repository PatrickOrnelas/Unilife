{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Unilife</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'global/css/login-neo.css' %}">
</head>
<body class="login-split">

  <main class="shell">
    <section class="card-split">

      <!-- LADO ESQUERDO -->
      <aside class="hero">
        <!-- fundo SVG animado vem via CSS -->
        <header class="brand">
          <img src="{% static 'global/img/logo-unilife.png' %}" alt="Unilife">
        </header>

        <div class="hero-copy">
          <h1>Olá, Bem-vindo!</h1>
          <p>Faça login para acessar o painel da academia</p>
        </div>
      </aside>

      <!-- LADO DIREITO -->
      <section class="panel">
        <div class="panel-inner">
          <h2>Login</h2>

          {% if form and form.errors %}
            <div class="err">CPF ou senha inválidos.</div>
          {% endif %}

          <form method="post" action="">
            {% csrf_token %}

            <label class="field">
              <span class="label">CPF</span>
              <input type="text" id="id_username" name="username" placeholder="000.000.000-00" autocomplete="username" required>
            </label>

            <label class="field">
              <span class="label">Senha</span>
              <div class="input-wrap">
                <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="peek" aria-label="Mostrar/ocultar senha">👁</button>
              </div>
            </label>

            <div class="row">
              <label class="check">
                <input type="checkbox" name="remember" value="1">
                <span>Lembrar de mim</span>
              </label>
              <a class="link" href="{% url 'recuperar-senha' %}">Esqueceu a senha?</a>
            </div>

            <button class="btn-primary" type="submit">Login</button>

            <div class="cta">
              <span>Ainda não é cadastrado?</span>
              <a class="btn-secondary" href="{% url 'registrar' %}">Cadastrar</a>
            </div>
          </form>
        </div>
      </section>

    </section>
  </main>

  <script>
    // máscara CPF
    document.addEventListener("input", (e) => {
      if (e.target.id === "id_username") {
        e.target.value = e.target.value.replace(/\D/g,'').slice(0,11)
          .replace(/(\d{3})(\d)/,'$1.$2')
          .replace(/(\d{3})(\d)/,'$1.$2')
          .replace(/(\d{3})(\d{1,2})$/,'$1-$2');
      }
    });
    // mostrar/ocultar senha
    (function(){
      const btn=document.querySelector('.peek'), input=document.getElementById('id_password');
      if(btn&&input){ btn.addEventListener('click', ()=>{ input.type = input.type==='password'?'text':'password'; }); }
    })();
  </script>
</body>
</html>
