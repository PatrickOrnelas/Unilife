{% load static %}
  <!-- JS -------------------------------------------------------->
  <script>
    /* ============================================================
 * Painel — JS principal
 * - NAV / LAYOUT / DROPDOWN USUÁRIO / VIEWS
 * - CADASTRAR PERSONAL (máscaras e validação)
 * - GP — GERENCIAR PERSONAL (API já existente)
 * - TB — CRIAR TREINO (views normais)
 * - WT — GERENCIAR TREINOS (views normais)
 * ============================================================ */

    (function () {
      const toggle = document.querySelector('.nav-toggle');
      const aside = document.querySelector('.app-sidenav');
      const backdrop = document.querySelector('.nav-backdrop');

      function openNav() {
        document.body.classList.add('nav-open', 'sidebar-open');
        toggle?.setAttribute('aria-expanded', 'true');
      }
      function closeNav() {
        document.body.classList.remove('nav-open', 'sidebar-open');
        toggle?.setAttribute('aria-expanded', 'false');
      }

      toggle?.addEventListener('click', () => {
        const willOpen = !document.body.classList.contains('nav-open');
        willOpen ? openNav() : closeNav();
      });
      backdrop?.addEventListener('click', closeNav);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

      // hover mantém a sidebar “aberta” no desktop
      aside?.addEventListener('mouseenter', () => document.body.classList.add('sidebar-open'));
      aside?.addEventListener('mouseleave', () => document.body.classList.remove('sidebar-open'));

      // Navegação por seções (hash router)
      const views = Array.from(document.querySelectorAll('[data-view]'));
      const links = Array.from(document.querySelectorAll('.sidenav-link'));
      const goBtns = Array.from(document.querySelectorAll('[data-go]'));

      function show(view) {
        views.forEach(v => v.hidden = (v.dataset.view !== view));
        links.forEach(a => a.classList.toggle('active', a.dataset.target === view));
        // Só adiciona hash se não for a view 'inicio' (home)
        if (view && view !== 'inicio') {
          location.hash = '#' + view;
        } else if (view === 'inicio') {
          // Para a view 'inicio', limpa o hash da URL
          history.replaceState(null, null, ' ');
        }
      }
      function currentFromHash() {
        const h = (location.hash || '').replace('#', '');
        return h && views.some(v => v.dataset.view === h) ? h : '';
      }

      function viewFromPath() {
        const p = location.pathname;
        if (p.endsWith('/admin/treinos/novo/')) return 'criar-treinos';
        if (p.endsWith('/admin/treinos/')) return 'gerenciar-treinos';
        if (p.endsWith('/admin/personais/')) return 'gerenciar-personal';
        return '';
      }

      links.forEach(a => a.addEventListener('click', (e) => {
        // Se o link tiver uma URL real (não apenas hash), permitir navegação normal
        if (a.href && !a.href.includes('#')) {
          return; // Permitir navegação padrão
        }
        e.preventDefault();
        closeNav();
        show(a.dataset.target);
        a.blur();
      }));
      goBtns.forEach(b => b.addEventListener('click', (e) => {
        e.preventDefault();
        show(b.dataset.go);
        closeNav();
      }));
      window.addEventListener('hashchange', () => { 
        const view = currentFromHash();
        if (view) {
          show(view); 
        }
        closeNav(); 
      });
      
      // Inicialização: determina view por hash ou pathname
      const initialView = currentFromHash() || viewFromPath();
      if (initialView) {
        views.forEach(v => v.hidden = (v.dataset.view !== initialView));
        links.forEach(a => a.classList.toggle('active', a.dataset.target === initialView));
      } else {
        views.forEach(v => v.hidden = (v.dataset.view !== 'inicio'));
        links.forEach(a => a.classList.toggle('active', a.dataset.target === 'inicio'));
      }

      // ===== Dropdown do usuário (header)
      const userTrig = document.querySelector('.user-trigger');
      const userDrop = document.querySelector('.user-dropdown');

      function closeUserMenu() {
        if (!userDrop || userDrop.hidden) return;
        userDrop.hidden = true;
        userTrig?.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', onUserOutside, true);
        document.removeEventListener('keydown', onUserEsc, true);
      }
      function openUserMenu() {
        if (!userDrop) return;
        userDrop.hidden = false;
        userTrig?.setAttribute('aria-expanded', 'true');
        document.addEventListener('click', onUserOutside, true);
        document.addEventListener('keydown', onUserEsc, true);
      }
      function onUserOutside(e) {
        if (!userDrop.contains(e.target) && !userTrig.contains(e.target)) closeUserMenu();
      }
      function onUserEsc(e) { if (e.key === 'Escape') closeUserMenu(); }

      userTrig?.addEventListener('click', (e) => {
        e.stopPropagation();
        userDrop?.hidden ? openUserMenu() : closeUserMenu();
      });
      window.addEventListener('hashchange', closeUserMenu);
      window.addEventListener('scroll', () => { if (!userDrop?.hidden) closeUserMenu(); }, { passive: true });

      // ===== Perfil: preview/remover avatar
      const avatarInput = document.getElementById('id_avatar');
      const avatarPrev = document.getElementById('avatar-preview');
      const avatarClearB = document.getElementById('avatar-clear');
      const avatarClearH = document.getElementById('avatar_clear');

      if (avatarInput && avatarPrev) {
        avatarInput.addEventListener('change', () => {
          const file = avatarInput.files && avatarInput.files[0];
          if (file) {
            const url = URL.createObjectURL(file);
            avatarPrev.src = url;
            if (avatarClearH) avatarClearH.value = '';
          }
        });
      }
      avatarClearB?.addEventListener('click', (e) => {
        e.preventDefault();
        if (avatarPrev) avatarPrev.src = "/static/global/img/avatar-default.png";
        if (avatarInput) avatarInput.value = '';
        if (avatarClearH) avatarClearH.value = '1';
      });

      // ===== Perfil: máscara de telefone (#phone)
      (function () {
        const tel = document.getElementById('phone');
        if (!tel) return;
        tel.addEventListener('input', () => {
          let v = tel.value.replace(/\D/g, '').slice(0, 11);
          if (v.length > 2 && v.length <= 6) v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
          else if (v.length > 6 && v.length <= 10) v = `(${v.slice(0, 2)}) ${v.slice(2, 6)}-${v.slice(6)}`;
          else if (v.length > 10) v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
          tel.value = v;
        });
      })();

      // ===== Tema: persistência system/light/dark
      (function () {
        const root = document.documentElement;
        const radios = document.querySelectorAll('input[name="theme"]');
        function applyTheme(mode) {
          if (mode === 'system') {
            root.removeAttribute('data-theme');
            localStorage.removeItem('theme');
          } else {
            root.setAttribute('data-theme', mode);
            localStorage.setItem('theme', mode);
          }
        }
        const saved = localStorage.getItem('theme');
        if (saved) {
          applyTheme(saved);
          const r = document.querySelector(`input[name="theme"][value="${saved}"]`);
          if (r) r.checked = true;
        }
        radios.forEach(r => r.addEventListener('change', () => applyTheme(r.value)));
      })();
    })();

    /* ============================================================
     * CADASTRAR PERSONAL — Máscaras (TEL, CPF) + Validação CREF
     * ============================================================ */
    (function () {
      const form = document.querySelector('section[data-view="cadastrar-personal"] form');

      // Telefone (id_tel)
      const tel = document.getElementById('id_tel');
      if (tel) {
        tel.addEventListener('input', () => {
          let v = tel.value.replace(/\D/g, '').slice(0, 11);
          if (v.length > 2 && v.length <= 6) v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
          else if (v.length > 6 && v.length <= 10) v = `(${v.slice(0, 2)}) ${v.slice(2, 6)}-${v.slice(6)}`;
          else if (v.length > 10) v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
          tel.value = v;
        });
      }

      // CPF (id_cpf)
      const cpf = document.getElementById('id_cpf');
      if (cpf) {
        cpf.addEventListener('input', () => {
          let v = cpf.value.replace(/\D/g, '').slice(0, 11);
          if (v.length > 3 && v.length <= 6) v = `${v.slice(0, 3)}.${v.slice(3)}`;
          else if (v.length > 6 && v.length <= 9) v = `${v.slice(0, 3)}.${v.slice(3, 6)}.${v.slice(6)}`;
          else if (v.length > 9) v = `${v.slice(0, 3)}.${v.slice(3, 6)}.${v.slice(6, 9)}-${v.slice(9)}`;
          cpf.value = v;
        });
      }

      // CREF — validação simples (mesma ideia do backend)
      function validaCREF(text) {
        const t = String(text || '').trim().toUpperCase();
        // Exemplos válidos: "CREF 123456-G/SP", "123456-SP", "CREF1234/SP"
        return /^(CREF\s*)?\d{4,7}(-?[A-Z])?(\/|-)?[A-Z]{2}$/.test(t);
      }

      form?.addEventListener('submit', (e) => {
        const crefin = document.getElementById('id_cref')?.value || '';
        if (!validaCREF(crefin)) {
          e.preventDefault();
          alert('Verifique o formato do CREF (ex.: CREF 123456-G/SP ou 123456-SP).');
          document.getElementById('id_cref')?.focus();
        }
      });
    })();

    /* ============================================================
     * Helpers
     * ============================================================ */
    function esc(s) {
      return (s ?? '').toString().replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
    function fmtDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso), p = n => String(n).padStart(2, '0');
      return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${p(d.getFullYear())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    function getCSRF() { return (document.cookie.match(/csrftoken=([^;]+)/) || [])[1]; }

    /* ============================================================
     * GP — GERENCIAR PERSONAL (endpoints já existentes)
     * ============================================================ */
    const GP = (() => {
      const state = {
        page: 1, pageSize: 10,
        q: "", sex: "", status: "",
        ordering: "-created_at",
        selected: new Set()
      };
      const $ = (s, root = document) => root.querySelector(s);
      const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

      function apiListURL() {
        const p = new URLSearchParams({
          page: state.page, page_size: state.pageSize,
          q: state.q, sex: state.sex, status: state.status,
          ordering: state.ordering
        });
        return `/api/personals/?` + p.toString();
      }

      async function load() {
        const res = await fetch(apiListURL(), { credentials: 'same-origin' });
        const data = await res.json();
        renderTable(data.results || []);
        renderPager(data.page || 1, data.num_pages || 1, data.count || 0);
        const allIds = (data.results || []).map(r => r.id);
        const allChecked = allIds.length && allIds.every(id => state.selected.has(id));
        const chkAll = $('#gp-checkall'); if (chkAll) chkAll.checked = allChecked;
      }

      function trHTML(r) {
        const checked = state.selected.has(r.id) ? 'checked' : '';
        const statusCls = r.is_active ? 'active' : 'inactive';
        const statusTxt = r.is_active ? 'Ativo' : 'Inativo';
        const created = fmtDateTime(r.created_at);
        return `
      <tr data-id="${r.id}">
        <td><input type="checkbox" class="gp-chk" ${checked}></td>
        <td>${r.id}</td>
        <td>${esc(r.first_name)}</td>
        <td>${esc(r.last_name)}</td>
        <td>${esc(r.cpf)}</td>
        <td>${esc(r.cref || '')}</td>
        <td>${esc(r.tel || '')}</td>
        <td>${esc(r.sex || '')}</td>
        <td><span class="muted">${esc(r.email || '')}</span></td>
        <td><span class="gp-status ${statusCls}">${statusTxt}</span></td>
        <td><span class="muted">${created}</span></td>
        <td>
          <div class="gp-actions">
            <a class="btn-ghost" href="/admin/personais/${r.id}/edit/">Editar</a>
            <button class="btn-ghost gp-toggle" type="button">${r.is_active ? 'Desativar' : 'Ativar'}</button>
            <button class="btn-ghost gp-del" type="button" style="color:#b91c1c;">Remover</button>
          </div>
        </td>
      </tr>`;
      }

      function renderTable(rows) {
        const tbody = document.getElementById('gp-tbody');
        if (!tbody) return;
        tbody.innerHTML = rows.map(trHTML).join('') || `<tr><td colspan="12" class="muted">Nenhum resultado.</td></tr>`;
        bindRowEvents();
      }

      function renderPager(page, numPages, count) {
        const pager = document.getElementById('gp-pager'); if (!pager) return;
        pager.innerHTML = `
      <button class="gp-pagebtn" ${page <= 1 ? 'disabled' : ''} data-page="${page - 1}">‹ Anterior</button>
      <span class="gp-pageinfo">Página ${page} de ${numPages} • ${count} registro(s)</span>
      <button class="gp-pagebtn" ${page >= numPages ? 'disabled' : ''} data-page="${page + 1}">Próxima ›</button>
    `;
        Array.from(pager.querySelectorAll('.gp-pagebtn')).forEach(b => {
          b.addEventListener('click', () => {
            const to = parseInt(b.dataset.page, 10);
            if (!Number.isNaN(to)) { state.page = to; load(); }
          });
        });
      }

      function bindRowEvents() {
        Array.from(document.querySelectorAll('.gp-chk')).forEach(chk => {
          chk.addEventListener('change', () => {
            const id = +chk.closest('tr').dataset.id;
            chk.checked ? state.selected.add(id) : state.selected.delete(id);
          });
        });
        Array.from(document.querySelectorAll('.gp-toggle')).forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = +btn.closest('tr').dataset.id;
            await post(`/api/personals/${id}/toggle/`, {});
            await load();
          });
        });
        Array.from(document.querySelectorAll('.gp-del')).forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = +btn.closest('tr').dataset.id;
            if (!confirm('Remover este personal?')) return;
            await post(`/api/personals/${id}/delete/`, {});
            state.selected.delete(id);
            await load();
          });
        });
      }

      function initUI() {
        const search = document.getElementById('gp-search');
        if (search) {
          let t; search.addEventListener('input', () => {
            clearTimeout(t);
            t = setTimeout(() => { state.q = search.value.trim(); state.page = 1; load(); }, 250);
          });
        }
        document.getElementById('gp-sex')?.addEventListener('change', e => { state.sex = e.target.value; state.page = 1; load(); });
        document.getElementById('gp-status')?.addEventListener('change', e => { state.status = e.target.value; state.page = 1; load(); });

        document.getElementById('gp-checkall')?.addEventListener('change', (e) => {
          const check = e.target.checked;
          document.querySelectorAll('#gp-tbody tr').forEach(tr => {
            const id = +tr.dataset.id;
            if (check) state.selected.add(id); else state.selected.delete(id);
            const box = tr.querySelector('.gp-chk'); if (box) box.checked = check;
          });
        });

        document.getElementById('gp-apply')?.addEventListener('click', async () => {
          const action = document.getElementById('gp-bulk').value;
          if (!action) return;
          const ids = Array.from(state.selected);
          if (!ids.length) return alert('Selecione pelo menos um registro.');
          if (action === 'delete' && !confirm(`Remover ${ids.length} registro(s)?`)) return;
          await post('/api/personals/bulk/', { action, ids });
          state.selected.clear();
          const chkAll = document.getElementById('gp-checkall'); if (chkAll) chkAll.checked = false;
          await load();
        });
      }

      async function post(url, payload) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRF() },
          credentials: 'same-origin',
          body: JSON.stringify(payload || {})
        });
        if (!res.ok) {
          const msg = await res.text();
          alert('Erro: ' + msg);
          throw new Error(msg);
        }
        return res.json().catch(() => ({}));
      }

      function maybeLoadOnView() {
        const current = (location.hash || '').replace('#', '') || 'inicio';
        const pathOk = location.pathname.endsWith('/admin/personais/');
        if (current === 'gerenciar-personal' || pathOk) { initUI(); load(); }
      }
      window.addEventListener('hashchange', maybeLoadOnView);
      document.addEventListener('DOMContentLoaded', maybeLoadOnView);

      return { load };
    })();

    /* ============================================================
     * TB — CRIAR TREINO (views normais)
     * Endpoints esperados:
     *   POST /workouts/create/        body: {name, day, items:[{name,muscle,sets,reps,load,rest,tempo,note}]}
     *   → {ok:true, workout_id: <int>}
     * ============================================================ */
    const TB = (() => {
      const MACHINES = [
        { id: 1, name: 'Supino reto (barra)', muscle: 'Peitoral', type: 'Máquina' },
        { id: 2, name: 'Supino inclinado (halteres)', muscle: 'Peitoral', type: 'Livre' },
        { id: 3, name: 'Peck deck', muscle: 'Peitoral', type: 'Máquina' },
        { id: 4, name: 'Agachamento guiado (Smith)', muscle: 'Pernas', type: 'Máquina' },
        { id: 5, name: 'Cadeira extensora', muscle: 'Pernas', type: 'Máquina' },
        { id: 6, name: 'Cadeira flexora', muscle: 'Pernas', type: 'Máquina' },
        { id: 7, name: 'Leg press 45°', muscle: 'Pernas', type: 'Máquina' },
        { id: 8, name: 'Cadeira abdutora', muscle: 'Glúteos', type: 'Máquina' },
        { id: 9, name: 'Cadeira adutora', muscle: 'Glúteos', type: 'Máquina' },
        { id: 10, name: 'Puxada frontal', muscle: 'Dorsais', type: 'Máquina' },
        { id: 11, name: 'Remada baixa', muscle: 'Dorsais', type: 'Máquina' },
        { id: 12, name: 'Desenvolvimento máquina', muscle: 'Deltoides', type: 'Máquina' },
        { id: 13, name: 'Elevação lateral', muscle: 'Deltoides', type: 'Livre' },
        { id: 14, name: 'Tríceps corda (polia)', muscle: 'Tríceps', type: 'Cabo' },
        { id: 15, name: 'Tríceps testa (barra W)', muscle: 'Tríceps', type: 'Livre' },
        { id: 16, name: 'Rosca direta (barra)', muscle: 'Bíceps', type: 'Livre' },
        { id: 17, name: 'Abdominal crunch (máquina)', muscle: 'Abdominais', type: 'Máquina' },
        { id: 18, name: 'Prancha', muscle: 'Abdominais', type: 'Isométrico' },
      ];

      const state = { name: '', day: '', rows: [] }; // rows: {id, name, muscle, sets, reps, load, rest, tempo, note}

      const $ = (s, root = document) => root.querySelector(s);
      const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

      function initUI() {
        if (!document.querySelector('[data-view="criar-treinos"]')) return;
        renderCatalog();

        $('#tb-q')?.addEventListener('input', debounce(renderCatalog, 120));
        $('#tb-filter')?.addEventListener('change', renderCatalog);

        $('#tb-save')?.addEventListener('click', onSave);
        $('#tb-clear')?.addEventListener('click', () => { state.rows = []; renderRows(); persist(); });

        restore();
        renderRows();

        $('#tb-name')?.addEventListener('input', e => { state.name = e.target.value; persist(); });
        $('#tb-day')?.addEventListener('change', e => { state.day = e.target.value; persist(); });
      }

      function catalogFiltered() {
        const q = ($('#tb-q')?.value || '').toLowerCase();
        const f = $('#tb-filter')?.value || '';
        return MACHINES.filter(m =>
          (!f || m.muscle === f) &&
          (!q || m.name.toLowerCase().includes(q) || m.muscle.toLowerCase().includes(q))
        );
      }

      function renderCatalog() {
        const list = $('#tb-list'); if (!list) return;
        const items = catalogFiltered();
        list.innerHTML = items.map(m => `
      <li class="tb-item">
        <div>
          <h4>${escapeHTML(m.name)}</h4>
          <div class="tb-tags">${m.muscle} • ${m.type}</div>
        </div>
        <button class="btn-ghost" type="button" data-add="${m.id}">Adicionar</button>
      </li>
    `).join('') || `<li class="tb-item"><div class="tb-tags">Nada encontrado.</div></li>`;

        $$('[data-add]', list).forEach(b => {
          b.addEventListener('click', () => {
            const id = +b.dataset.add;
            const m = MACHINES.find(x => x.id === id);
            if (!m) return;
            state.rows.push({
              id: cryptoRandom(), name: m.name, muscle: m.muscle,
              sets: 3, reps: 12, load: '', rest: 60, tempo: '2-0-2', note: ''
            });
            renderRows(); persist();
          });
        });
      }

      function renderRows() {
        const tbody = $('#tb-body'); if (!tbody) return;
        tbody.innerHTML = state.rows.map((r, i) => rowHTML(r, i)).join('');
        bindRowEvents();
        const name = $('#tb-name'), day = $('#tb-day');
        if (name) name.value = state.name || '';
        if (day) day.value = state.day || '';
      }

      function rowHTML(r, i) {
        return `
      <tr data-id="${r.id}">
        <td>${i + 1}</td>
        <td>${escapeHTML(r.name)}</td>
        <td><span class="muted">${r.muscle}</span></td>
        <td><input type="number" min="1" value="${r.sets}" data-k="sets"  inputmode="numeric"></td>
        <td><input type="number" min="1" value="${r.reps}" data-k="reps"  inputmode="numeric"></td>
        <td><input type="text"   value="${r.load}" data-k="load" placeholder="kg ou livre"></td>
        <td><input type="number" min="0" value="${r.rest}" data-k="rest" inputmode="numeric"></td>
        <td><input type="text"   value="${r.tempo}" data-k="tempo" placeholder="ex.: 2-0-2"></td>
        <td><input type="text"   value="${r.note}" data-k="note"  placeholder="Obs. (cadência, técnica…)"></td>
        <td>
          <div class="tb-order">
            <button type="button" class="up">⬆</button>
            <button type="button" class="down">⬇</button>
            <button type="button" class="tb-row-del">Remover</button>
          </div>
        </td>
      </tr>`;
      }

      function bindRowEvents() {
        const tbody = document.getElementById('tb-body'); if (!tbody) return;
        Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
          const id = tr.dataset.id;
          Array.from(tr.querySelectorAll('input')).forEach(inp => {
            inp.addEventListener('input', () => {
              const row = state.rows.find(r => r.id === id);
              if (!row) return;
              const k = inp.dataset.k;
              if (k === 'sets' || k === 'reps' || k === 'rest') row[k] = parseInt(inp.value || '0', 10) || 0;
              else row[k] = inp.value;
              persist();
            });
          });
          tr.querySelector('.up')?.addEventListener('click', () => moveRow(id, -1));
          tr.querySelector('.down')?.addEventListener('click', () => moveRow(id, +1));
          tr.querySelector('.tb-row-del')?.addEventListener('click', () => {
            state.rows = state.rows.filter(r => r.id !== id);
            renderRows(); persist();
          });
        });
      }

      function moveRow(id, dir) {
        const i = state.rows.findIndex(r => r.id === id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= state.rows.length) return;
        const [row] = state.rows.splice(i, 1);
        state.rows.splice(j, 0, row);
        renderRows(); persist();
      }

      const KEY = 'tb-plan-v1';
      function persist() {
        localStorage.setItem(KEY, JSON.stringify({ name: state.name, day: state.day, rows: state.rows }));
      }
      function restore() {
        try {
          const raw = JSON.parse(localStorage.getItem(KEY) || '{}');
          state.name = raw.name || '';
          state.day = raw.day || '';
          state.rows = Array.isArray(raw.rows) ? raw.rows : [];
        } catch (_) { /* ignore */ }
      }

      async function onSave() {
        const payload = {
          name: $('#tb-name')?.value?.trim() || 'Treino',
          day: $('#tb-day')?.value || '',
          items: state.rows.map(({ id, ...rest }) => rest) // não enviar id local
        };
        if (!payload.items.length) {
          alert('Adicione pelo menos 1 exercício.');
          return;
        }
        try {
         
          const id = (window.__TB_EDITING_ID__ || null);
          const url = id ? `/workouts/${id}/edit/` : '/workouts/create/';
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRF() },
            credentials: 'same-origin',
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json().catch(() => ({}));
          alert('Treino salvo com sucesso!' + (data.workout_id ? ` (ID ${data.workout_id})` : ''));
          // opcional: limpar
          state.rows = [];
          renderRows();
          persist();
          window.__TB_EDITING_ID__ = null;
        } catch (err) {
          console.error(err);
          alert('Erro ao salvar treino.');
        }
      }

      function cryptoRandom() { return (self.crypto?.randomUUID?.() || (String(Math.random()).slice(2) + Date.now())); }
      function escapeHTML(s) { return (s ?? '').toString().replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
      async function loadExisting(id){
        const res = await fetch(`/workouts/${id}/`, { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        const w = data.workout || {};
        state.name = w.name || '';
        state.day = w.day || '';
        state.rows = (Array.isArray(w.items) ? w.items.map((it, idx) => ({ id: cryptoRandom()+idx, ...it })) : []);
        renderRows();
        persist();
        window.__TB_EDITING_ID__ = id;
      }

      function maybeInit() {
        const view = (location.hash || '').replace('#', '') || 'inicio';
        const pathOk = location.pathname.endsWith('/admin/treinos/novo/');
        if (view === 'criar-treinos' || pathOk) initUI();
        try {
          const params = new URLSearchParams(location.search || '');
          const id = parseInt(params.get('id') || '');
          if (pathOk && id) loadExisting(id);
        } catch (_) {}
      }
      window.addEventListener('hashchange', maybeInit);
      document.addEventListener('DOMContentLoaded', maybeInit);

      return { initUI };
    })();

    /* ============================================================
     * WT — GERENCIAR TREINOS (views normais)
     * Endpoints esperados:
     *   GET  /workouts/list/?q=&day=&status=&page=
     *   POST /workouts/<id>/toggle/
     *   POST /workouts/<id>/delete/
     *   POST /workouts/<id>/duplicate/
     *   POST /workouts/assign/   body: {workout_id, aluno_id}
     *   GET  /students/search/?q=...
     * ============================================================ */
    const WT = (() => {
      const state = { page: 1, pageSize: 10, q: '', day: '', status: '', selected: new Set() };
      const $ = (s, root = document) => root.querySelector(s);
      const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

      function urlList() {
        const p = new URLSearchParams({ page: state.page, page_size: state.pageSize, q: state.q, day: state.day, status: state.status });
        return '/workouts/list/?' + p.toString();
      }

      async function load() {
        const res = await fetch(urlList(), { credentials: 'same-origin' });
        const data = await res.json();
        renderTable(data.results || []);
        renderPager(data.page || 1, data.num_pages || 1, data.count || 0);
        const ids = (data.results || []).map(r => r.id);
        const chkAll = $('#wt-checkall'); if (chkAll) chkAll.checked = (ids.length && ids.every(id => state.selected.has(id)));
      }

      function renderTable(rows) {
        const tbody = $('#wt-tbody'); if (!tbody) return;
        tbody.innerHTML = rows.map(r => {
          const status = r.is_active ? 'active' : 'inactive';
          return `
        <tr data-id="${r.id}">
          <td><input class="wt-chk" type="checkbox" ${state.selected.has(r.id) ? 'checked' : ''}></td>
          <td>${r.id}</td>
          <td>${esc(r.student_name || '—')} <span class="muted">${esc(r.student_email || '')}</span></td>
          <td>${esc(r.name)}</td>
          <td>${esc(r.day || '—')}</td>
          <td>${r.items_count || 0}</td>
          <td><span class="wt-status ${status}">${r.is_active ? 'Ativo' : 'Inativo'}</span></td>
          <td><span class="muted">${fmtDateTime(r.updated_at || r.created_at)}</span></td>
          <td>
              <div class="wt-actions">
                <a class="btn-ghost" href="/admin/treinos/novo/?id=${r.id}" data-go="criar-treinos">Editar</a>
                <button class="btn-ghost wt-assign" type="button">Vincular aluno</button>
                <button class="btn-ghost wt-toggle" type="button">${r.is_active ? 'Desativar' : 'Ativar'}</button>
                <button class="btn-ghost wt-dup" type="button">Duplicar</button>
                <button class="btn-ghost wt-del" type="button" style="color:#b91c1c;">Excluir</button>
              </div>
            </td>
        </tr>`;
        }).join('') || `<tr><td colspan="9" class="muted">Nenhum treino encontrado.</td></tr>`;
        bindRowEvents();
      }

      function renderPager(page, num, count) {
        const el = $('#wt-pager'); if (!el) return;
        el.innerHTML = `
      <button class="wt-pagebtn" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>‹ Anterior</button>
      <span class="wt-pageinfo">Página ${page} de ${num} • ${count} registro(s)</span>
      <button class="wt-pagebtn" data-p="${page + 1}" ${page >= num ? 'disabled' : ''}>Próxima ›</button>
    `;
        $$('.wt-pagebtn', el).forEach(b => b.addEventListener('click', () => {
          const to = +b.dataset.p; if (!Number.isNaN(to)) { state.page = to; load(); }
        }));
      }

      function bindRowEvents() {
        $$('.wt-chk').forEach(chk => {
          chk.addEventListener('change', () => {
            const id = +chk.closest('tr').dataset.id;
            chk.checked ? state.selected.add(id) : state.selected.delete(id);
          });
        });
        $$('.wt-toggle').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = +btn.closest('tr').dataset.id;
            await post(`/workouts/${id}/toggle/`, {});
            load();
          });
        });
        $$('.wt-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = +btn.closest('tr').dataset.id;
            if (!confirm('Excluir este treino?')) return;
            await post(`/workouts/${id}/delete/`, {});
            state.selected.delete(id); load();
          });
        });
        $$('.wt-dup').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = +btn.closest('tr').dataset.id;
            await post(`/workouts/${id}/duplicate/`, {});
            load();
          });
        });
        $$('.wt-assign').forEach(btn => {
          btn.addEventListener('click', () => openAssign(+btn.closest('tr').dataset.id));
        });
      }

      function initUI() {
        $('#wt-q')?.addEventListener('input', debounce(() => { state.q = $('#wt-q').value.trim(); state.page = 1; load(); }, 250));
        $('#wt-day')?.addEventListener('change', e => { state.day = e.target.value; state.page = 1; load(); });
        $('#wt-status')?.addEventListener('change', e => { state.status = e.target.value; state.page = 1; load(); });

        $('#wt-checkall')?.addEventListener('change', e => {
          const check = e.target.checked;
          document.querySelectorAll('#wt-tbody tr').forEach(tr => {
            const id = +tr.dataset.id;
            if (check) state.selected.add(id); else state.selected.delete(id);
            const box = tr.querySelector('.wt-chk'); if (box) box.checked = check;
          });
        });

        $('#wt-apply')?.addEventListener('click', async () => {
          const action = $('#wt-bulk').value;
          const ids = Array.from(state.selected);
          if (!action || !ids.length) return alert('Escolha uma ação e selecione pelo menos um treino.');
          if (action === 'delete' && !confirm(`Excluir ${ids.length} treino(s)?`)) return;
          await post('/workouts/bulk/', { action, ids });
          state.selected.clear(); const chkAll = $('#wt-checkall'); if (chkAll) chkAll.checked = false; load();
        });

        // Modal: vincular aluno
        $('#wt-assign-cancel')?.addEventListener('click', () => $('#wt-assign').close());
        $('#wt-assign-q')?.addEventListener('input', debounce(onSearchStudents, 250));
      }

      // Modal: vincular aluno
      let assigningId = null;
      function openAssign(workoutId) {
        assigningId = workoutId;
        const dlg = $('#wt-assign'); if (!dlg) return;
        $('#wt-assign-q').value = '';
        $('#wt-assign-list').innerHTML = '<li class="muted">Digite para buscar…</li>';
        dlg.showModal();
      }

      async function onSearchStudents() {
        const q = $('#wt-assign-q').value.trim();
        if (!q) { $('#wt-assign-list').innerHTML = '<li class="muted">Digite para buscar…</li>'; return; }
        const res = await fetch(`/students/search/?q=${encodeURIComponent(q)}`, { credentials: 'same-origin' });
        const data = await res.json();
        $('#wt-assign-list').innerHTML = (data.results || []).map(s => `
      <li>
        <div><strong>${esc(s.name)}</strong> <span class="muted">${esc(s.email || '')}</span></div>
        <button class="btn-ghost wt-pick" data-id="${s.id}" type="button">Vincular</button>
      </li>`).join('') || '<li class="muted">Nenhum aluno.</li>';
        $$('.wt-pick').forEach(b => b.addEventListener('click', () => linkStudent(+b.dataset.id)));
      }

      async function linkStudent(aluno_id) {
        if (!assigningId) return;
        await post(`/workouts/assign/`, { workout_id: assigningId, aluno_id });
        $('#wt-assign').close(); load();
      }

      async function post(url, payload) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRF() },
          credentials: 'same-origin',
          body: JSON.stringify(payload || {})
        });
        if (!res.ok) throw new Error(await res.text());
        return res.json().catch(() => ({}));
      }

      function maybeInit() {
        const view = (location.hash || '').replace('#', '') || 'inicio';
        const pathOk = location.pathname.endsWith('/admin/treinos/');
        if (view === 'gerenciar-treinos' || pathOk) { initUI(); load(); }
      }
      window.addEventListener('hashchange', maybeInit);
      document.addEventListener('DOMContentLoaded', maybeInit);
      return { load };
    })();

  </script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggle = document.querySelector(".nav-toggle"); // botão que abre/fecha o menu
  const aside = document.querySelector(".app-sidenav");
  const backdrop = document.querySelector(".nav-backdrop");

  if (!aside) return;

  function openMenu() {
    aside.classList.add("open");
    if (backdrop) backdrop.setAttribute("aria-hidden", "false");
  }
  function closeMenu() {
    aside.classList.remove("open");
    if (backdrop) backdrop.setAttribute("aria-hidden", "true");
  }

  if (toggle) toggle.addEventListener("click", () => {
    aside.classList.toggle("open");
    const opened = aside.classList.contains("open");
    if (backdrop) backdrop.setAttribute("aria-hidden", opened ? "false" : "true");
  });

  if (backdrop) backdrop.addEventListener("click", closeMenu);
});
</script>
